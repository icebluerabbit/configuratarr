name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # No `release-type` here on purpose: passing it puts the action in
          # standalone mode, where it ignores release-please-config.json and
          # .release-please-manifest.json. The manifest is what records that
          # 0.1.1 already shipped — without it the action sees no git tag and
          # no release, and proposes 0.1.0 all over again.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  upload-assets:
    needs: release-please
    # Compared against the string: an output of "false" is still truthy to
    # GitHub's expression parser, and the matrix would then upload to an
    # empty tag name.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            platform: linux-amd64
          # Native arm64 runner — building aarch64-linux under QEMU binfmt
          # emulation made this the longest job in the release by far.
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            platform: linux-arm64
          - os: macos-13
            system: x86_64-darwin
            platform: darwin-amd64
          - os: macos-14
            system: aarch64-darwin
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: icebluerabbit-${{ vars.CACHIX_CACHE }}
          extraPullNames: icebluerabbit-cleanuparr-flake,icebluerabbit-lazylibrarian
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build via Nix
        run: |
          nix build .#packages.${{ matrix.system }}.configuratarr
          tar -czf configuratarr-${{ matrix.platform }}.tar.gz -C result/bin configuratarr

      - name: Upload asset to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} configuratarr-${{ matrix.platform }}.tar.gz
