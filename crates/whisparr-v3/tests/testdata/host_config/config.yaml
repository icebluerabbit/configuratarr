bind_address: "*"
port: 6969
ssl_port: 6970
enable_ssl: false
launch_browser: true
authentication_method: forms
authentication_required: enabled
analytics_enabled: true
username: admin
password: ${env.WHISPARR_PASSWORD}
password_confirmation: ${env.WHISPARR_PASSWORD}
log_level: info
log_size_limit: 1
branch: master
api_key: ${env.WHISPARR_API_KEY}
ssl_cert_path: /etc/whisparr/cert.pfx
ssl_cert_password: ${env.WHISPARR_CERT_PASSWORD}
url_base: ""
instance_name: Whisparr
application_url: ""
update_automatically: false
update_mechanism: docker
proxy_enabled: false
proxy_type: http
proxy_hostname: proxy.example.com
proxy_port: 8080
proxy_username: proxyuser
proxy_password: ${env.WHISPARR_PROXY_PASSWORD}
proxy_bypass_local_addresses: true
certificate_validation: enabled
backup_folder: Backups
backup_interval: 7
backup_retention: 28
trust_cgnat_ip_addresses: false
whisparr_always_exclude_performers_tag: exclude-performer
whisparr_always_exclude_studios_tag: exclude-studio
whisparr_always_exclude_studios_after_tag: exclude-studio-after
whisparr_always_exclude_tags_tag: exclude-always
whisparr_auto_match_on_date: true
whisparr_cache_exclusion_api: true
whisparr_cache_movie_api: true
whisparr_cache_performer_api: true
whisparr_cache_studio_api: true
whisparr_corrupt_file_detection: true
whisparr_movie_metadata_source: tpdb
whisparr_validate_runtime: true
whisparr_validate_runtime_limit: 15
